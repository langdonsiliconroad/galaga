<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaga</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; background: #000; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let player = { x: canvas.width / 2 - 25, y: canvas.height - 50, width: 50, height: 30 };
        let bullets = [];
        let enemies = [];
        let score = 0;

        for (let i = 0; i < 5; i++) {
            enemies.push({ x: Math.random() * (canvas.width - 50), y: Math.random() * 200, width: 50, height: 30 });
        }

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            bullets.forEach(bullet => {
                bullet.y -= 5;
                ctx.fillRect(bullet.x, bullet.y, 5, 20);
            });
            enemies.forEach(enemy => {
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
            });
            bullets = bullets.filter(bullet => bullet.y > 0);
        }

        function shoot() {
            bullets.push({ x: player.x + player.width / 2 - 2.5, y: player.y });
        }

        window.addEventListener('keydown', function(e) {
            if (e.key === ' ') shoot();
            else if (e.key === 'ArrowLeft' && player.x > 0) player.x -= 20;
            else if (e.key === 'ArrowRight' && player.x < canvas.width - player.width) player.x += 20;
        });

        function gameLoop() {
            update();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
